function DeckModal({ deck, onClose }) {
  const [slide, setSlide] = useState(0);
  const current = deck?.slides?.[slide];

  useEffect(() => setSlide(0), [deck]);

  useEffect(() => {
    if (!deck) return;
    const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handleKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', handleKey);
      document.body.style.overflow = '';
    };
  }, [deck, onClose]);

  if (!deck) return null;

  return (
    <AnimatePresence>
      <motion.div className="modalShell" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
        <motion.div className="deck" initial={{ y: 60, scale: 0.96 }} animate={{ y: 0, scale: 1 }} exit={{ y: 50, scale: 0.96 }}>
          <div className="deckTop">
            <div>
              <p>{deck.eyebrow}</p>
              <h3>{deck.title}</h3>
            </div>
            <button onClick={onClose}>close</button>
          </div>
          <AnimatePresence mode="wait">
            <motion.div key={slide} className="deckSlide" initial={{ opacity: 0, x: 35 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -35 }} transition={{ duration: 0.35 }}>
              <span>{current.label}</span>
              <h2>{current.title}</h2>
              <p>{current.text}</p>
            </motion.div>
          </AnimatePresence>
          <div className="deckControls">
            <button onClick={() => setSlide((s) => Math.max(0, s - 1))}>prev</button>
            <div className="dots">
              {deck.slides.map((_, i) => (
                <button key={i} className={i === slide ? "active" : ""} onClick={() => setSlide(i)} aria-label={`Open slide ${i + 1}`} />
              ))}
            </div>
            <button onClick={() => setSlide((s) => Math.min(deck.slides.length - 1, s + 1))}>next</button>
          </div>
        </motion.div>
      </motion.div>
    </AnimatePresence>
  );
}

function CounterNumber({ value, prefix = "", suffix = "" }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, amount: 0.45 });
  const [display, setDisplay] = useState(0);

  useEffect(() => {
    if (!inView) return;
    let frame;
    let start;
    const duration = 1350;
    const animate = (time) => {
      if (!start) start = time;
      const progress = Math.min((time - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setDisplay(value * eased);
      if (progress < 1) frame = requestAnimationFrame(animate);
    };
    frame = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(frame);
  }, [value, inView]);

  const formatted = value % 1 === 0 ? Math.round(display) : display.toFixed(1);
  return <span ref={ref}>{prefix}{formatted}{suffix}</span>;
}

.compareRail { display: grid; gap: 12px; }

.excuseSection { background: #fffaf2; }

.excuseFolder { position: relative; min-height: 390px; cursor: pointer; isolation: isolate; }
.paperTab { position: absolute; top: 0; left: 20px; right: 30px; height: 72px; border-radius: 24px 24px 0 0; background: #ffd0c2; display: flex; align-items: center; padding-left: 24px; color: rgba(0,0,0,0.55); letter-spacing: -0.02em; z-index: 1; }
.folderFace { position: absolute; inset: 54px 0 0; border-radius: 30px; background: linear-gradient(180deg, #f0e7dc, #d6b096); box-shadow: 0 24px 60px rgba(0,0,0,0.12); padding: 34px; display: flex; flex-direction: column; justify-content: end; z-index: 3; transition: transform .35s ease; }
.folderFace span { color: rgba(0,0,0,0.45); font-size: 13px; }
.folderFace h3 { font-size: clamp(30px, 2.8vw, 48px); line-height: 0.98; letter-spacing: -0.05em; max-width: 260px; }
.notePage { position: absolute; left: 16px; right: 16px; bottom: 42px; min-height: 260px; border-radius: 24px; background: #fffdf7; border: 1px solid var(--line); z-index: 2; padding: 28px; box-shadow: 0 18px 50px rgba(0,0,0,0.16); }

.productionSection { background: #f7f7f2; }

.locationBox { fill: #fffaf0; stroke: rgba(0,0,0,0.16); }

.svgTitle { font-size: 25px; font-weight: 800; letter-spacing: -0.045em; fill: #1a1a1a; }
.cameraRig rect, .cameraRig circle, .lightRig circle, .bramhaCore circle { fill: none; stroke: #111; stroke-width: 4; }

.budgetSection { background: #f4f4f4; overflow: hidden; }
.liquidBudget { margin-top: 78px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: stretch; }
.budgetSide { min-height: 620px; border-radius: 34px; padding: 34px; position: relative; overflow: hidden; border: 1px solid var(--line); }
.traditionalSide { background: #101010; color: #fff; }
.bramhaSide { background: linear-gradient(145deg, rgba(255,255,255,0.72), rgba(210,226,255,0.46)); color: var(--ink); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
.budgetSide h3 { font-size: clamp(38px, 4vw, 68px); line-height: 0.96; letter-spacing: -0.055em; max-width: 520px; }

.blackBubbles { position: absolute; inset: 210px 28px 28px; max-width: 100%; }

.blackBubble:nth-child(2) { right: 18%; top: 2%; }
.blackBubble:nth-child(3) { left: 42%; top: 34%; width: 150px; height: 150px; }
.blackBubble:nth-child(4) { right: 4%; bottom: 8%; width: 138px; height: 138px; }
.blackBubble:nth-child(5) { left: 12%; bottom: 2%; width: 172px; height: 172px; }

.blackBubble span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #aaa; }
.liquidCore { position: absolute; left: 50%; top: 55%; width: 330px; height: 330px; transform: translate(-50%, -50%); border-radius: 42% 58% 55% 45% / 48% 38% 62% 52%; background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.98), rgba(173,211,255,0.68) 42%, rgba(23,56,255,0.12) 100%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 0 45px rgba(255,255,255,0.8), 0 30px 80px rgba(23,56,255,0.18); display: grid; place-items: center; text-align: center; padding: 54px; animation: liquidMove 7s ease-in-out infinite; }
.liquidCore strong { font-size: clamp(56px, 6vw, 88px); font-weight: 500; letter-spacing: -0.055em; }
.liquidCore span { display: block; font-size: 14px; letter-spacing: -0.018em; color: var(--blue); text-transform: uppercase; margin-top: 8px; }
.miniLiquidRow { position: absolute; left: 34px; right: 34px; bottom: 34px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.miniLiquidRow i { min-height: 62px; border-radius: 999px; background: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.86); display: grid; place-items: center; font-style: normal; color: var(--blue); box-shadow: inset 0 0 20px rgba(255,255,255,0.8); }
@keyframes liquidMove { 0%,100% { border-radius: 42% 58% 55% 45% / 48% 38% 62% 52%; transform: translate(-50%, -50%) rotate(0deg); } 50% { border-radius: 55% 45% 42% 58% / 38% 55% 45% 62%; transform: translate(-50%, -50%) rotate(3deg); } }

.dossierPanel { min-height: 100vh; padding: 0 clamp(22px, 5vw, 72px); display: grid; grid-template-columns: .9fr 1.35fr; align-items: center; gap: 60px; background: #faf9f5; overflow: hidden; }
.dossierIntro { position: relative; max-width: 560px; }
.dossierIntro h2 { font-size: clamp(50px, 6.4vw, 96px); line-height: .94; letter-spacing: -0.06em; margin-top: 20px; }
.dossierIntro p:not(.micro) { color: var(--muted); font-size: clamp(18px, 1.8vw, 24px); line-height: 1.2; letter-spacing: -.018em; margin-top: 24px; max-width: 480px; }
.scribbleMark { width: min(420px, 100%); margin-top: 50px; overflow: visible; }
.scribbleMark path { fill: none; stroke: #111; stroke-width: 3; stroke-linecap: round; }

.dossierFolders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: center; }

.stickyNotes { position: absolute; right: 7vw; top: 14vh; width: 350px; height: 250px; pointer-events: none; }

.stickyNotes .note1 { left: 128px; top: 18px; transform: rotate(7deg); background: #f8f0d1; }
.stickyNotes .note2 { left: 76px; top: 128px; transform: rotate(-2deg); background: #b9d889; }
.folder { position: relative; width: 100%; max-width: 360px; height: 210px; border: 0; background: transparent; cursor: pointer; text-align: left; color: #093044; filter: drop-shadow(0 18px 35px rgba(0,119,255,.2)); }
.folderTab { position: absolute; top: 10px; left: 0; width: 48%; height: 52px; background: linear-gradient(180deg, #62c7ff, #1da8f8); border-radius: 18px 26px 0 0; }
.folderBody { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; border-radius: 22px; background: linear-gradient(180deg, #6bd7ff, #0e9bf2); border: 1px solid rgba(0,0,0,.08); padding: 88px 26px 24px; display: grid; }
.folderBody span { font-size: 34px; letter-spacing: -0.06em; color: #053047; }
.folderBody small { color: rgba(5,48,71,.7); font-size: 14px; }
.folderHint { position: absolute; top: -34px; left: 12px; background: #fff; border: 1px solid var(--blue); color: var(--blue); padding: 6px 10px; font-size: 12px; opacity: 0; transform: translateY(8px); transition: .2s ease; z-index: 2; }
.folder:hover .folderHint { opacity: 1; transform: translateY(0); }

.outputMap { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 80px; background: #111; color: #f7f2e8; }
.outputLeft p { color: #aaa; }
.outputCards { display: grid; gap: 12px; }

.outputCards span { color: var(--blue); font-size: 14px; }
.outputCards h3 { font-size: 34px; letter-spacing: -0.04em; line-height: 1.02; margin: 18px 0 8px; }
.outputCards p { color: #bdbdbd; line-height: 1.22; letter-spacing: -0.018em; }
.final { min-height: 82vh; display: flex; flex-direction: column; justify-content: center; }

.modalShell { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 300; display: grid; place-items: center; padding: 22px; }
.deck { width: min(1080px, 100%); background: #f8f6ef; border-radius: 28px; border: 1px solid rgba(255,255,255,.25); box-shadow: 0 40px 120px rgba(0,0,0,.35); overflow: hidden; }
.deckTop { display: flex; justify-content: space-between; padding: 28px; border-bottom: 1px solid var(--line); }
.deckTop p { color: var(--blue); font-size: 13px; margin-bottom: 8px; }
.deckTop h3 { font-size: 28px; letter-spacing: -0.06em; }
.deckTop button, .deckControls button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
.deckSlide { padding: clamp(30px, 7vw, 80px); min-height: 470px; }
.deckSlide span { display: inline-block; color: var(--blue); border-bottom: 2px solid var(--blue); margin-bottom: 26px; }
.deckSlide h2 { font-size: clamp(42px, 6vw, 78px); line-height: 0.98; letter-spacing: -0.055em; max-width: 940px; text-wrap: balance; overflow-wrap: break-word; }
.deckSlide p { font-size: 24px; line-height: 1.22; letter-spacing: -0.018em; color: var(--muted); margin-top: 32px; max-width: 880px; }

.dots { display: flex; gap: 8px; flex-wrap: wrap; max-width: 50%; justify-content: center; }
.dots button { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; background: rgba(0,0,0,.18); }
.dots .active { background: var(--blue); }

@media (max-width: 1050px) {
  .storyLayout, .liquidBudget, .compareColumns, .posterSection, .binderBody, .dossierPanel, .outputMap { grid-template-columns: 1fr; }
  .storyGrid, .storyGrid.compact { grid-template-columns: repeat(2, 1fr); }
  .walkSteps { grid-template-columns: repeat(2, 1fr); }
  .excuseGrid { grid-template-columns: repeat(2, 1fr); }
  .compareRail { grid-template-columns: repeat(4, 1fr); }
  .compareRail p { writing-mode: horizontal-tb; transform: none; }
  .dossierPanel { padding-top: 120px; padding-bottom: 120px; }
  .dossierFolders { grid-template-columns: 1fr; }
  .stickyNotes { position: relative; right: auto; top: auto; margin-top: 30px; }
}

@media (max-width: 900px) {
  nav { display: none; }
  .hamburger { display: flex; }
  .heroMark { display: none; }
  .gridIntro { min-height: auto; grid-template-columns: 1fr; grid-template-rows: auto; gap: 42px; display: grid; }
  .sideLabel, .introBlock, .note.one, .note.two, .folderFloating { grid-column: auto; grid-row: auto; }
  .posterImage { min-height: 56vh; }
  .binderHeader, .binderBody { margin-left: 0; }
  .productionFrame { overflow-x: auto; }
  .productionSvg { min-width: 900px; }
  .blackBubbles { position: relative; inset: auto; margin-top: 34px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .blackBubble, .blackBubble:nth-child(n) { position: static; width: 100%; height: 150px; }
  .liquidCore { position: relative; left: auto; top: auto; transform: none; margin: 60px auto 120px; }
  .miniLiquidRow { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 620px) {
  .storyGrid, .storyGrid.compact, .walkSteps, .excuseGrid { grid-template-columns: 1fr; }
  .storyCard { min-height: 300px; }
  .deckSlide p { font-size: 19px; }
  .pageGrid { grid-template-columns: 1fr; gap: 10px; }
  .pageTabs { right: 10px; top: 10px; display: flex; }
  .pageTabs button { writing-mode: horizontal-tb; border-radius: 999px; padding: 8px 12px; }
  .flipPage { min-height: 620px; padding: 26px; }
  .dossierIntro h2 { font-size: clamp(44px, 13vw, 72px); }
  .stickyNotes { display: none; }
}

/* ── Missing modifier classes (semantic, no-op but prevents lint warnings) */
.foldersPanel {}
.pitchBinder {}
.pitchBody {}
.pageGrid.desc { border-top: none; }

/* ── Hamburger ─────────────────────────────────────── */
.hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 8px;
  z-index: 200;
  pointer-events: auto;
}
.bar {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--ink);
  border-radius: 2px;
  transition: transform 0.3s ease, opacity 0.3s ease;
}
.mobileNav {
  position: fixed;
  top: 88px;
  left: 0;
  right: 0;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  z-index: 99;
  padding: 12px 0 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.08);
}
.mobileNav a {
  padding: 14px clamp(22px, 5vw, 72px);
  font-size: 22px;
  letter-spacing: -0.04em;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
.mobileNav a:last-child { border-bottom: none; }
.mobileNav a:hover { color: var(--blue); }

/* ── Mobile 480px ──────────────────────────────────── */

  .outputMap { gap: 40px; padding: 60px clamp(16px, 5vw, 28px); }
  .outputCards h3 { font-size: 26px; }
  .dossierPanel { padding: 80px clamp(16px, 5vw, 28px); gap: 40px; }
  .dossierIntro h2 { font-size: clamp(38px, 11vw, 60px); }

  .walkStep { min-height: 160px; }
  .excuseFolder { min-height: 320px; }
  .binderHeader p { font-size: clamp(26px, 7vw, 44px); }
  .binderHeader h2 { font-size: clamp(36px, 9vw, 60px); }
